schema: spec-driven

context: |
  Project: Mornlea is an independent voxel game written in Go 1.26. The root `go.work` coordinates six modules (`packages/contracts`, `packages/shared`, `packages/server`, `packages/client`, `packages/tools`, and `packages/audit`), each with module path prefix `github.com/channing771/mornlea/packages/<unit>`; the repository root is not a Go module. The project is not compatible with the official Minecraft protocol, saves, or copyrighted assets.
  Current version matrix: protocol v45, player schema v9, chunk schema v9, world metadata v6, standalone `companions.ai` schema v5, standalone `hostile_mobs` schema v2, standalone `passive_mobs` schema v1, engine ABI v11, client ABI v19, and benchmark scenario v23.
  Authority boundary: the server is the sole authority for world and player state; clients hold only mirrors, predictions, and presentation state. Local Memory and remote TCP modes are constrained by the same packet/codec contracts and reuse the same login, session, and authoritative simulation paths.
  Language ownership: the current production path is Go for app, world, simulation, network, storage, and the CPU half of rendering, with Rust `mornlea_engine` for numerical computation and Rust `mornlea_client` for Darwin windows/events/GPU rendering. The target path in `docs/architecture-target.md` moves the real-time server and client core to Rust and keeps Godot's qualified embedded Python as the presentation language; Go and the current Python/Go pilot seams are migration exceptions only.
  ABI boundary: only `packages/shared/nativeabi` touches the engine ABI, and only `packages/client/client` touches the client ABI. Domain packages call Rust through the established bridges.
  Architecture constraints: internal package dependencies are defined by `packages/audit/dependency_test.go`; no Go package may import WebGPU bindings. A message and its slices are immutable after a successful cross-goroutine send. Authoritative tick, render, and network hot paths must not perform unbounded work or blocking I/O.
  Asset boundary: do not add Mojang copyrighted textures or other unauthorized binary art assets. Do not relax gates for real overflow, data loss, report identity, or I/O failures.
  Authoritative entry points: current behavior is defined by code, tests, and `openspec/specs/`. Current architecture is documented in `docs/architecture.md`; new architecture direction is documented in `docs/architecture-target.md`; the documentation map is `docs/README.md`, and implementation chronology is `docs/notes/progress.md`. `docs/superpowers/` and archived changes are historical evidence only.

rules:
  proposal:
    - Write normative prose in English and state the context, goals, non-goals, user-observable outcome, and affected packages or documents.
    - Limit the change to one minimal unit that can be independently reviewed, validated, and rolled back.
    - State compatibility, save, protocol, concurrency, and performance effects explicitly; say when an effect is not applicable.
  specs:
    - Write observable behavior in English and preserve OpenSpec's required structural headings and SHALL/MUST terminology.
    - Give every Requirement at least one decidable Given/When/Then Scenario and cover important failure paths or boundaries.
    - Specify behavioral contracts only; put package structure, type choices, and implementation steps in `design.md`.
  design:
    - Use Superpowers brainstorming; the main Agent resolves architecture, functional behavior, exact interfaces, lifecycle, algorithms, compatibility, failure policy and resource bounds before delegating implementation.
    - For a new or materially changed boundary shared by multiple implementation tasks, identify one owner and design a compile-ready contract landing before parallel provider or consumer work; follow `docs/interface-first-parallel-development.md` without adding an interface layer to private one-task behavior.
    - Write in English and describe data ownership, dependency direction, concurrency boundaries, and affected files without bypassing existing architecture gates.
    - For save, network protocol, or performance-contract changes, include compatibility or migration handling, risks, rollback, and validation.
    - Record rejected alternatives and the reason for each important trade-off.
  tasks:
    - Use Superpowers writing-plans to produce concrete worker briefs inside the active change; keep tasks.md as the sole status source and link subsystem detail.
    - Parallel task plans must name the shared-contract landing predecessor, direct dependencies, exclusive editable files, read-only contract files, and serial adapter/integration owner; at dispatch, record the accepted contract SHA and distinguish contract, real-provider and real-integration evidence.
    - The main Agent must finish every architectural and functional decision, define exact files and producer/consumer signatures, dependencies, implementation steps, concrete failing tests, expected outcomes, validation, exclusions and rollback before marking a node ready. Workers implement frozen contracts and escalate discrepancies.
    - Decompose broad milestones into independently testable nodes; self-review requirement coverage, acyclic dependencies, matching types and missing boundary cases. Do not leave catch-all tasks or controller-held design placeholders in a completed implementation plan.
    - Write in English and split work into ordered, independently verifiable checkboxes; keep tests and the corresponding implementation in the same task group.
    - Name the target file or package and exact validation command for every task; avoid non-decidable descriptions such as "complete development".
    - Closeout tasks must include formatting, `make test-race` for all six Go modules, six-module `go vet` through `make dev-check` or `scripts/agents/gates.sh`, and strict OpenSpec validation; add platform-specific or performance gates when applicable.

operations:
  apply:
    guidance:
      - Before implementation, reread the proposal, delta specifications, design, and tasks and treat those artifacts as the scope boundary.
      - Start independent shared-boundary tasks only after the compile-ready contract landing is accepted. A double or compile-only test proves neither real-provider conformance nor integrated acceptance; contract changes require a controller ruling, updated affected briefs, a new accepted identity and revalidation.
      - During discovery, read the ancestor `AGENTS.md` chain for every affected directory. When a task creates, reorganizes, or materially reassigns an important directory, create or update its local `AGENTS.md` in the same change; when no independent invariant warrants a guide, record the inheritance rationale.
      - Follow red-green-refactor for behavior changes, preserve pre-existing and unrelated user worktree changes, and record implementation progress, validation evidence, review decisions, and material rulings in the change ledger.
      - If implementation reveals an invalid specification or design, reconcile the affected OpenSpec artifacts before continuing.
      - "A verified ChatGPT or Codex controller using an OpenAI model has standing project authorization to choose direct, delegated, or mixed execution and proportionate review depth without a separate per-task user request. OpenAI-native orchestration is isolation-first: prefer a fresh agent for bounded discovery, multi-file reasoning, specialized review, or other work whose main-context retention cost exceeds its handoff cost; keep only tiny or tightly coupled work in the controller. Run at most three subagents concurrently. Parallel speed or unused capacity alone is not sufficient. An explicit user prohibition or higher-priority runtime restriction always controls."
      - Before dispatch, apply the controller-owned Superpowers planning checklist in the project mornlea-implementation-orchestration skill; existing user authorization persists and planning completion does not prove implementation acceptance.
      - Give each delegate a concise task brief containing only the required evidence, paths, constraints, ownership, integration point, and acceptance criteria. Use a minimal or fresh context rather than copying the full controller conversation by default.
      - A non-OpenAI or unknown-provider controller must use strict `subagent-driven-development` with independent implementation and review responsibilities. Every mode preserves approved OpenSpec scope, test-first work, file ownership, required validation, completion evidence, safety rules, and authorization boundaries; orchestration discretion never permits skipping gates or expanding scope.
  archive:
    guidance:
      - Before archive, confirm task status and implementation match the delta specifications, then run `openspec validate --all --strict --no-interactive`.
      - Merge reusable behavioral contracts into canonical specifications; update `AGENTS.md` or `openspec/config.yaml` for project-wide working practices.
      - When necessary, update the root `AGENTS.md` version matrix and the corresponding canonical specification or `docs/notes/progress.md`; `TestBaselineVersionsMatchCode` in `packages/audit` enforces the version values. Keep `CLAUDE.md` as a thin shim only.
