[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "mornlea-audit"
version = "0.1.0"
description = "Mornlea architectural audit and boundary verification"
requires-python = ">=3.12"
dependencies = [
    "pytest>=8.0.0",
    "pyyaml>=6.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "packages/audit"]
