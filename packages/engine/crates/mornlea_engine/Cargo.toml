[package]
name = "mornlea_engine"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

# Test-only corpus support: the numerical closure consumer loads manifest
# fixtures and digests arenas. Production builds carry no serde dependency.
[dev-dependencies]
serde = "=1.0.229"
serde_json = "=1.0.151"
sha2 = "0.10"
