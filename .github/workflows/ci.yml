name: Required CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: required-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/packages/engine/target/cargo

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Record start time
        run: echo "CI_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26'
          # Header changes invalidate cached cgo ABI constants.
          cache-dependency-path: |
            packages/shared/go.sum
            packages/server/go.sum
            packages/client/go.sum
            packages/tools/go.sum
            packages/engine/include/mornlea_engine.h
            packages/engine/include/mornlea_client.h
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.5'
          enable-cache: true
          cache-dependency-glob: |
            packages/audit/pyproject.toml
            packages/audit/uv.lock
      - name: Install policy dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
      - name: Run preflight
        run: make ci-preflight
      - name: Record duration and runner
        if: ${{ always() }}
        run: |
          {
            echo "preflight seconds: $(( $(date +%s) - CI_START_EPOCH ))"
            echo "runner: ${RUNNER_OS}/$(uname -m)"
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      - name: Record start time
        run: echo "CI_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # Bootstrap the packageManager-pinned pnpm before setup-node resolves its cache.
      # setup-node probes `pnpm store path` from the repository root, outside the
      # pinned project, so make the pinned version Corepack's global default too.
      - name: Enable Corepack pnpm
        run: |
          corepack enable
          cd packages/engine/crates/mornlea_client/frontend
          corepack install --global "$(node -p 'require("./package.json").packageManager')"
          corepack pnpm --version
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: packages/engine/crates/mornlea_client/frontend/pnpm-lock.yaml
      - name: Run frontend
        run: make ci-frontend
      - name: Record duration and runner
        if: ${{ always() }}
        run: |
          {
            echo "frontend seconds: $(( $(date +%s) - CI_START_EPOCH ))"
            echo "runner: ${RUNNER_OS}/$(uname -m)"
          } >> "$GITHUB_STEP_SUMMARY"

  rust-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Record start time
        run: echo "CI_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26'
          cache-dependency-path: |
            packages/shared/go.sum
            packages/server/go.sum
            packages/client/go.sum
            packages/tools/go.sum
            packages/engine/include/mornlea_engine.h
            packages/engine/include/mornlea_client.h
      - name: Activate repository-pinned Rust toolchain
        run: |
          cd packages/engine
          rustup show active-toolchain
          rustc --version
          cargo --version
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.5'
          enable-cache: true
          cache-dependency-glob: |
            packages/agent/pyproject.toml
            packages/agent/uv.lock
      - name: Run rust-quality
        run: make ci-rust-quality
      - name: Record duration and runner
        if: ${{ always() }}
        run: |
          {
            echo "rust-quality seconds: $(( $(date +%s) - CI_START_EPOCH ))"
            echo "runner: ${RUNNER_OS}/$(uname -m)"
          } >> "$GITHUB_STEP_SUMMARY"

  native-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Record start time
        run: echo "CI_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26'
          # Header changes invalidate cached cgo ABI constants.
          cache-dependency-path: |
            packages/shared/go.sum
            packages/server/go.sum
            packages/client/go.sum
            packages/tools/go.sum
            packages/engine/include/mornlea_engine.h
            packages/engine/include/mornlea_client.h
      - name: Activate repository-pinned Rust toolchain
        run: |
          cd packages/engine
          rustup show active-toolchain
          rustc --version
          cargo --version
      - name: Run native-linux
        run: make ci-native-linux CI_CANDIDATE_SHA="$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-linux-${{ github.sha }}
          if-no-files-found: error
          retention-days: 1
          path: |
            build/ci/native-linux.manifest
            bin/mornlea-server
            bin/libmornlea_engine.so
            packages/engine/target/release/libmornlea_engine.so
      - name: Record duration and runner
        if: ${{ always() }}
        run: |
          {
            echo "native-linux seconds: $(( $(date +%s) - CI_START_EPOCH ))"
            echo "runner: ${RUNNER_OS}/$(uname -m)"
          } >> "$GITHUB_STEP_SUMMARY"

  native-macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Record start time
        run: echo "CI_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26'
          # Header changes invalidate cached cgo ABI constants.
          cache-dependency-path: |
            packages/shared/go.sum
            packages/server/go.sum
            packages/client/go.sum
            packages/tools/go.sum
            packages/engine/include/mornlea_engine.h
            packages/engine/include/mornlea_client.h
      - name: Activate repository-pinned Rust toolchain
        run: |
          cd packages/engine
          rustup show active-toolchain
          rustc --version
          cargo --version
      - name: Run native-macos
        run: make ci-native-macos CI_CANDIDATE_SHA="$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-macos-${{ github.sha }}
          if-no-files-found: error
          retention-days: 1
          path: |
            build/ci/native-macos.manifest
            packages/engine/target/release/libmornlea_engine.dylib
            packages/engine/target/release/libmornlea_client.dylib
      - name: Record duration and runner
        if: ${{ always() }}
        run: |
          {
            echo "native-macos seconds: $(( $(date +%s) - CI_START_EPOCH ))"
            echo "runner: ${RUNNER_OS}/$(uname -m)"
          } >> "$GITHUB_STEP_SUMMARY"

  linux-quality:
    needs: native-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Record start time
        run: echo "CI_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26'
          # Header changes invalidate cached cgo ABI constants.
          cache-dependency-path: |
            packages/shared/go.sum
            packages/server/go.sum
            packages/client/go.sum
            packages/tools/go.sum
            packages/engine/include/mornlea_engine.h
            packages/engine/include/mornlea_client.h
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.5'
          enable-cache: true
          cache-dependency-glob: |
            packages/audit/pyproject.toml
            packages/audit/uv.lock
      - name: Install policy dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: native-linux-${{ github.sha }}
          path: .
      - name: Run linux-quality
        run: make ci-linux-quality CI_CANDIDATE_SHA="$GITHUB_SHA"
      - name: Record duration and runner
        if: ${{ always() }}
        run: |
          {
            echo "linux-quality seconds: $(( $(date +%s) - CI_START_EPOCH ))"
            echo "runner: ${RUNNER_OS}/$(uname -m)"
          } >> "$GITHUB_STEP_SUMMARY"

  race-server:
    needs: native-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Record start time
        run: echo "CI_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26'
          # Header changes invalidate cached cgo ABI constants.
          cache-dependency-path: |
            packages/shared/go.sum
            packages/server/go.sum
            packages/client/go.sum
            packages/tools/go.sum
            packages/engine/include/mornlea_engine.h
            packages/engine/include/mornlea_client.h
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: native-linux-${{ github.sha }}
          path: .
      - name: Run race-server
        run: make ci-race-server CI_CANDIDATE_SHA="$GITHUB_SHA"
      - name: Record duration and runner
        if: ${{ always() }}
        run: |
          {
            echo "race-server seconds: $(( $(date +%s) - CI_START_EPOCH ))"
            echo "runner: ${RUNNER_OS}/$(uname -m)"
          } >> "$GITHUB_STEP_SUMMARY"

  race-rest:
    needs: native-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Record start time
        run: echo "CI_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26'
          # Header changes invalidate cached cgo ABI constants.
          cache-dependency-path: |
            packages/shared/go.sum
            packages/server/go.sum
            packages/client/go.sum
            packages/tools/go.sum
            packages/engine/include/mornlea_engine.h
            packages/engine/include/mornlea_client.h
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.5'
          enable-cache: true
          cache-dependency-glob: |
            packages/audit/pyproject.toml
            packages/audit/uv.lock
      - name: Install policy dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: native-linux-${{ github.sha }}
          path: .
      - name: Run race-rest
        run: make ci-race-rest CI_CANDIDATE_SHA="$GITHUB_SHA"
      - name: Record duration and runner
        if: ${{ always() }}
        run: |
          {
            echo "race-rest seconds: $(( $(date +%s) - CI_START_EPOCH ))"
            echo "runner: ${RUNNER_OS}/$(uname -m)"
          } >> "$GITHUB_STEP_SUMMARY"

  race-client:
    needs: native-macos
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Record start time
        run: echo "CI_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26'
          # Header changes invalidate cached cgo ABI constants.
          cache-dependency-path: |
            packages/shared/go.sum
            packages/server/go.sum
            packages/client/go.sum
            packages/tools/go.sum
            packages/engine/include/mornlea_engine.h
            packages/engine/include/mornlea_client.h
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: native-macos-${{ github.sha }}
          path: .
      - name: Run race-client
        run: make ci-race-client CI_CANDIDATE_SHA="$GITHUB_SHA"
      - name: Record duration and runner
        if: ${{ always() }}
        run: |
          {
            echo "race-client seconds: $(( $(date +%s) - CI_START_EPOCH ))"
            echo "runner: ${RUNNER_OS}/$(uname -m)"
          } >> "$GITHUB_STEP_SUMMARY"

  integration-server:
    needs: native-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Record start time
        run: echo "CI_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26'
          # Header changes invalidate cached cgo ABI constants.
          cache-dependency-path: |
            packages/shared/go.sum
            packages/server/go.sum
            packages/client/go.sum
            packages/tools/go.sum
            packages/engine/include/mornlea_engine.h
            packages/engine/include/mornlea_client.h
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.5'
          enable-cache: true
          cache-dependency-glob: |
            packages/agent/pyproject.toml
            packages/agent/uv.lock
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: native-linux-${{ github.sha }}
          path: .
      - name: Run integration-server
        run: make ci-integration-server CI_CANDIDATE_SHA="$GITHUB_SHA"
      - name: Record duration and runner
        if: ${{ always() }}
        run: |
          {
            echo "integration-server seconds: $(( $(date +%s) - CI_START_EPOCH ))"
            echo "runner: ${RUNNER_OS}/$(uname -m)"
          } >> "$GITHUB_STEP_SUMMARY"

  integration-client:
    needs: native-macos
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Record start time
        run: echo "CI_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26'
          # Header changes invalidate cached cgo ABI constants.
          cache-dependency-path: |
            packages/shared/go.sum
            packages/server/go.sum
            packages/client/go.sum
            packages/tools/go.sum
            packages/engine/include/mornlea_engine.h
            packages/engine/include/mornlea_client.h
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: native-macos-${{ github.sha }}
          path: .
      - name: Run integration-client
        run: make ci-integration-client CI_CANDIDATE_SHA="$GITHUB_SHA"
      - name: Record duration and runner
        if: ${{ always() }}
        run: |
          {
            echo "integration-client seconds: $(( $(date +%s) - CI_START_EPOCH ))"
            echo "runner: ${RUNNER_OS}/$(uname -m)"
          } >> "$GITHUB_STEP_SUMMARY"

  # Every predecessor must succeed; skipped and cancelled work cannot authorize a merge.
  merge-gate:
    if: ${{ always() }}
    needs: [preflight, frontend, rust-quality, native-linux, native-macos, linux-quality, race-server, race-rest, race-client, integration-server, integration-client]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Assert every required result
        run: |
          test "${{ needs.preflight.result }}" = success
          test "${{ needs.frontend.result }}" = success
          test "${{ needs.rust-quality.result }}" = success
          test "${{ needs.native-linux.result }}" = success
          test "${{ needs.native-macos.result }}" = success
          test "${{ needs.linux-quality.result }}" = success
          test "${{ needs.race-server.result }}" = success
          test "${{ needs.race-rest.result }}" = success
          test "${{ needs.race-client.result }}" = success
          test "${{ needs.integration-server.result }}" = success
          test "${{ needs.integration-client.result }}" = success
