name: Godot CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/godot.yml'
      - 'Makefile'
      - 'apps/mornlea-godot/**'
      - 'go.work'
      - 'go.work.sum'
      - 'packages/audit/tests/test_godot.py'
      - 'packages/audit/audit/**'
      - 'packages/client/assets/**'
      - 'packages/client/client/**'
      - 'packages/client/cmd/mornlea-godot-assets/**'
      - 'packages/client/cmd/mornlea-godot-core/**'
      - 'packages/client/go.mod'
      - 'packages/client/go.sum'
      - 'packages/client/mesh/**'
      - 'packages/client/presentation/**'
      - 'packages/client/render/**'
      - 'packages/client/runtime/**'
      - 'packages/contracts/**'
      - 'packages/engine/**'
      - 'packages/server/go.mod'
      - 'packages/server/go.sum'
      - 'packages/shared/**'
      - 'packages/tools/go.mod'
      - 'packages/tools/go.sum'
      - 'scripts/ci/**'
      - 'scripts/engine/**'
      - 'scripts/godot/**'
  pull_request:
    paths:
      - '.github/workflows/godot.yml'
      - 'Makefile'
      - 'apps/mornlea-godot/**'
      - 'go.work'
      - 'go.work.sum'
      - 'packages/audit/tests/test_godot.py'
      - 'packages/audit/audit/**'
      - 'packages/client/assets/**'
      - 'packages/client/client/**'
      - 'packages/client/cmd/mornlea-godot-assets/**'
      - 'packages/client/cmd/mornlea-godot-core/**'
      - 'packages/client/go.mod'
      - 'packages/client/go.sum'
      - 'packages/client/mesh/**'
      - 'packages/client/presentation/**'
      - 'packages/client/render/**'
      - 'packages/client/runtime/**'
      - 'packages/contracts/**'
      - 'packages/engine/**'
      - 'packages/server/go.mod'
      - 'packages/server/go.sum'
      - 'packages/shared/**'
      - 'packages/tools/go.mod'
      - 'packages/tools/go.sum'
      - 'scripts/ci/**'
      - 'scripts/engine/**'
      - 'scripts/godot/**'

permissions:
  contents: read

concurrency:
  group: godot-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Migration qualification stays outside Required CI / merge-gate.
jobs:
  godot-static:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Record start time
        run: echo "CI_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install static dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
      - name: Check static dependencies
        run: scripts/ci/doctor.sh godot-static
      - name: Check project closure
        run: make godot-project-check
      - name: Record duration and runner
        if: ${{ always() }}
        run: |
          {
            echo "godot-static seconds: $(( $(date +%s) - CI_START_EPOCH ))"
            echo "runner: ${RUNNER_OS}/$(uname -m)"
          } >> "$GITHUB_STEP_SUMMARY"

  godot-runtime:
    needs: godot-static
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - name: Record start time
        run: echo "CI_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26'
          cache-dependency-path: |
            go.work.sum
            packages/shared/go.sum
            packages/server/go.sum
            packages/client/go.sum
            packages/tools/go.sum
            packages/engine/include/mornlea_engine.h
            packages/engine/include/mornlea_client.h
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.5'
      - name: Install runtime dependencies
        run: brew install ripgrep
      - name: Activate repository-pinned Rust toolchain
        run: |
          cd packages/engine
          rustup show active-toolchain
          rustc --version
          cargo --version
      - name: Check runtime dependencies
        run: scripts/ci/doctor.sh godot-runtime
      - name: Download workspace module dependencies
        run: |
          for module in packages/contracts packages/shared packages/server packages/client packages/tools; do
            (cd "$module" && GOWORK=off go mod download)
          done
      - name: Build native libraries
        run: make rust
      - name: Check deterministic assets
        run: make godot-asset-check
      - name: Fetch pinned Godot
        run: scripts/godot/fetch.sh
      - name: Build and verify embedded Python
        run: scripts/godot/build-python-runtime.sh --verify
      - name: Build and verify Godot distribution
        run: make godot-build
      - name: Check embedded Python sources
        run: make godot-python-check
      - name: Run lifecycle smoke
        run: make godot-smoke
      - name: Qualify exported application
        run: scripts/godot/python-runtime-check.sh --exported --offline
      - name: Record duration and runner
        if: ${{ always() }}
        run: |
          {
            echo "godot-runtime seconds: $(( $(date +%s) - CI_START_EPOCH ))"
            echo "runner: ${RUNNER_OS}/$(uname -m)"
          } >> "$GITHUB_STEP_SUMMARY"
